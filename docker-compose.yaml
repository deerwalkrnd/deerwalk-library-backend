name: Deerwalk Library

services:
  postgres:
    image: postgres:17
    container_name: dev_postgres
    environment:
      POSTGRES_DB: dev_db
      POSTGRES_USER: dev-user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev-user -d dev_db"]
      interval: 30s
      timeout: 10s
      retries: 3
  
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
  
volumes:
  postgres_data:
  redis_data:
  # Persistent storage for user-uploaded files (book covers, profile images,
  # event banners) so they survive container rebuilds. The backend service is
  # managed separately by devops and is not defined here; mount this volume into
  # that container at the app's upload_dir (default "media", i.e. /app/media):
  #   services:
  #     backend:
  #       volumes:
  #         - media_data:/app/media
  #       environment:
  #         UPLOAD_DIR: /app/media
  #         MEDIA_BASE_URL: https://<backend-host>
  media_data: